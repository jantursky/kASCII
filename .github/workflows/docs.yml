name: Docs

# Deploys the docs site to Vercel after each change to it, to the design tokens it imports, to the agent skill it
# publishes or to the changelog it shows. Every step waits for apps/docs/package.json, which does not exist yet, so the
# job does nothing until the docs site does. Forks have no Vercel token, so the deploy step is skipped there.
on:
  push:
    branches: [main]
    paths: ['apps/docs/**', 'design/**', 'skills/**', 'CHANGELOG.md', 'gradle.properties', 'package.json', 'bun.lock']
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for Vercel credentials
        if: hashFiles('apps/docs/package.json') != ''
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "enabled=$([ -n "$VERCEL_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Vercel
        if: hashFiles('apps/docs/package.json') != '' && steps.vercel.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # The Apptiary team and its kascii-docs project. Neither is a secret.
          VERCEL_ORG_ID: team_K9StkqZREJ9hVsKscavg7bgs
          VERCEL_PROJECT_ID: prj_xwDFDqk6svA0xe8S8DGLHLbimh9K
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
