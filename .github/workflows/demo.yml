name: Demo

# Builds the gallery sample, runs its browser suite on every change to the library, the samples or the Gradle build,
# and deploys it as a static site to Vercel after a push to main only when that suite passed on the same commit.
# Pull requests run the suite and never deploy, even from the same repository, because they would otherwise reach
# the Vercel token. Forks have no Vercel secrets, so the deploy step is skipped there.
on:
  push:
    branches: [main]
    paths: ['kascii-*/**', 'samples/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'playwright.config.ts', 'package.json', 'bun.lock']
  # No paths filter here: the suite is a required check, and a skipped run would leave it pending.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the gallery
        run: ./gradlew :samples:web:wasmJsBrowserDistribution
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Browser suite against the production build
        # Firefox runs in its own job below: it fails on the Linux runner and does not block the gate yet.
        run: bun run test:web -- --project=desktop --project=phone --project=safari

  web-firefox:
    # Informational until the Firefox exception on Linux is fixed (see the follow-up in tasks.md).
    # Not a required check: continue-on-error keeps a failure visible without blocking the gate.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the gallery
        run: ./gradlew :samples:web:wasmJsBrowserDistribution
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install Firefox
        run: bunx playwright install --with-deps firefox
      - name: Firefox suite against the production build
        run: bun run test:web -- --project=firefox

  deploy:
    needs: web-e2e
    # Only pushes to main deploy: pull requests never see the Vercel token.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the gallery
        run: ./gradlew :samples:web:wasmJsBrowserDistribution
      - name: Check for Vercel credentials
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "enabled=$([ -n "$VERCEL_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Vercel
        if: steps.vercel.outputs.enabled == 'true'
        working-directory: samples/web/build/dist/wasmJs/productionExecutable
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # The Apptiary team and its kascii-demo project. Neither is a secret.
          VERCEL_ORG_ID: team_K9StkqZREJ9hVsKscavg7bgs
          VERCEL_PROJECT_ID: prj_xBFHV0lurqDHQJ8UswXSSBCxGvqH
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
