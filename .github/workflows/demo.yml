name: Demo

# Builds the gallery sample and deploys it as a static site to Vercel after each change to the library, the samples or
# the Gradle build. Every step waits for samples/web, which does not exist yet, so the job does nothing until it does.
# Forks have no Vercel secrets, so the deploy step is skipped there.
on:
  push:
    branches: [main]
    paths: ['kascii-*/**', 'samples/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']
  workflow_dispatch:

concurrency:
  group: demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: hashFiles('samples/web/build.gradle.kts') != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        if: hashFiles('samples/web/build.gradle.kts') != ''
      - name: Build the gallery
        if: hashFiles('samples/web/build.gradle.kts') != ''
        run: ./gradlew :samples:web:wasmJsBrowserDistribution
      - name: Check for Vercel credentials
        if: hashFiles('samples/web/build.gradle.kts') != ''
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "enabled=$([ -n "$VERCEL_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Vercel
        if: hashFiles('samples/web/build.gradle.kts') != '' && steps.vercel.outputs.enabled == 'true'
        working-directory: samples/web/build/dist/wasmJs/productionExecutable
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # The Apptiary team and its kascii-demo project. Neither is a secret.
          VERCEL_ORG_ID: team_K9StkqZREJ9hVsKscavg7bgs
          VERCEL_PROJECT_ID: prj_xBFHV0lurqDHQJ8UswXSSBCxGvqH
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
